<!DOCTYPE html>
<html>
<head>
    <title>Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #4CAF50; }
        .error { background: #f44336; }
        .info { background: #2196F3; }
        button { padding: 10px 20px; margin: 5px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1976D2; }
        #log { background: #333; padding: 10px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🔧 Dashboard Connection Test</h1>
    
    <div>
        <button onclick="testAPI()">Test API</button>
        <button onclick="testWebSocket()">Test WebSocket</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="status" class="status info">Ready to test connections...</div>
    
    <h3>Connection Log:</h3>
    <div id="log"></div>

    <script>
        let ws = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#51cf66' : '#74c0fc';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        async function testAPI() {
            log('🧪 Testing API connection...', 'info');
            updateStatus('Testing API...', 'info');
            
            try {
                // Test health endpoint
                const healthResponse = await fetch('http://localhost:1203/api/health');
                const healthData = await healthResponse.json();
                log(`✅ Health check: ${JSON.stringify(healthData)}`, 'success');
                
                // Test metrics endpoint
                const metricsResponse = await fetch('http://localhost:1203/api/dashboard/metrics');
                const metricsData = await metricsResponse.json();
                log(`✅ Metrics: ${JSON.stringify(metricsData)}`, 'success');
                
                updateStatus('API connection successful!', 'success');
                
            } catch (error) {
                log(`❌ API test failed: ${error.message}`, 'error');
                updateStatus('API connection failed!', 'error');
            }
        }
        
        function testWebSocket() {
            log('🔌 Testing WebSocket connection...', 'info');
            updateStatus('Testing WebSocket...', 'info');
            
            if (ws) {
                ws.close();
            }
            
            const wsUrl = 'ws://localhost:1203/ws';
            log(`Connecting to: ${wsUrl}`, 'info');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function(event) {
                log('✅ WebSocket connected successfully!', 'success');
                updateStatus('WebSocket connected!', 'success');
                
                // Send a test message
                ws.send(JSON.stringify({ type: 'ping' }));
                log('📤 Sent ping message', 'info');
            };
            
            ws.onmessage = function(event) {
                log(`📥 Received: ${event.data}`, 'success');
            };
            
            ws.onclose = function(event) {
                log(`❌ WebSocket closed. Code: ${event.code}, Reason: ${event.reason}`, 'error');
                updateStatus('WebSocket disconnected', 'error');
            };
            
            ws.onerror = function(error) {
                log(`❌ WebSocket error: ${error}`, 'error');
                updateStatus('WebSocket error', 'error');
            };
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🚀 Connection test page loaded', 'info');
            setTimeout(testAPI, 1000);
            setTimeout(testWebSocket, 2000);
        };
    </script>
</body>
</html>
